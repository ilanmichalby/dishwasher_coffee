name: Pre-Shabbat health check

# Catches, WHILE THERE IS STILL TIME TO FIX IT BY HAND, everything that
# silently fails a Shabbat or chag run: the Tuya gateway off WiFi or unplugged,
# a SwitchBot with a dead battery or in the wrong mode, a dishwasher that
# dropped off the network, a door left open, remote start never armed. The job
# FAILS (which emails the repo owner) when something is scheduled and not ready.
#
# When this runs, in Israel local time — the only clock that matters here:
#
#   PRIMARY path is not this workflow at all. The whole Shabbat/chag gets
#   scheduled in one sitting, 1 to 1.5 hours before candle lighting, and
#   /api/schedule enqueues a single verification for 45 minutes after that
#   sitting starts. That lands while there is still time to reboot a gateway,
#   in every season and on every chag, without anyone knowing when candle
#   lighting is. When it finds a problem it fires repository_dispatch, which
#   triggers this workflow so the email below goes out.
#
#   This cron is only a BACKSTOP for the case where QStash is down and the
#   verification never fires. Twice on Friday: 13:00 and 15:00 UTC, which is
#   16:00 and 18:00 Israel in summer, 15:00 and 17:00 in winter. It is
#   deliberately NOT daily — a chag is covered by the scheduling session, not
#   by this.
#
#   A run that finds an empty queue reports healthy and says nothing, so a
#   backstop firing before you have scheduled is harmless noise, not an alert.
#
# Requires the same repo secrets as the reconciliation cron: APP_URL, CRON_SECRET.

on:
  schedule:
    - cron: '0 13,15 * * 5'   # Friday backstop only — see the timing note above
  workflow_dispatch: {}
  # Raised by /api/health/pre-shabbat when the session verification fails, so
  # the alert email below is sent by the one place that knows how to send it.
  repository_dispatch:
    types: [pre-shabbat-unhealthy]

# A slow run must never overlap the next hour's run.
concurrency:
  group: pre-shabbat-health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Fingerbot reachability
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing APP_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi

          # Secret goes in the Authorization header, never the URL, so it isn't
          # logged. 200 = healthy, 503 = coffee scheduled but Fingerbot offline.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/health/coffee") || code=000
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo

          if [ "$code" = "200" ]; then
            echo "Healthy ✅"
            exit 0
          fi

          echo "UNHEALTHY — a coffee is scheduled but the brew path is not ready." >&2
          echo "See the message above (offline gateway, SwitchBot battery, or wrong mode)." >&2
          exit 1

      - name: Check dishwashers are reachable and ready
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          # Everything that silently fails a Shabbat run — appliance off the
          # network, door open, remote start not armed — is fixable now.
          code=$(curl -sS -o /tmp/dw.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/health/dishwashers") || code=000
          echo "HTTP $code"
          cat /tmp/dw.json 2>/dev/null || true
          echo

          if [ "$code" = "200" ]; then
            echo "Dishwashers ready ✅"
            exit 0
          fi

          echo "UNHEALTHY — a dishwasher run is scheduled but the appliance is not ready." >&2
          exit 1

      - name: Send failure alert email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ לפני שבת/חג: משהו לא מוכן (קפה/מדיח)"
          to: ilanmichalby@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            הבדיקה מצאה בעיה שתמנע הפעלה בשבת/בחג.

            פירוט מלא (מה בדיוק נכשל):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            מה זה בדרך כלל, ומה לעשות עכשיו:
            - Fingerbot אופליין  -> לבדוק שהשקע של שער ה-Tuya מחובר, לאתחל, ולוודא שהוא חוזר ל-WiFi.
            - סוללת SwitchBot נמוכה -> להחליף סוללה.
            - SwitchBot לא ב-pressMode -> לתקן באפליקציית SwitchBot.
            - מדיח מנותק -> לבדוק WiFi ולהפעיל "חיבור רשת קבוע" בתפריט המדיח.
            - דלת פתוחה -> לסגור.
            - הפעלה מרחוק לא מאושרת -> ללחוץ על הכפתור בלוח המדיח.

            אפשר לבדוק שוב בכל רגע מהדשבורד, בכפתור "בדוק והדפס".
            יש עדיין זמן לתקן. בשבת כבר לא.
