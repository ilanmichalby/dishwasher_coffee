name: Pre-Shabbat health check

# Catches on FRIDAY everything that silently fails a Shabbat run, while there
# is still time to fix it by hand: the Tuya gateway off WiFi, a SwitchBot with
# a dead battery or in the wrong mode, a dishwasher that dropped off the
# network, a door left open, remote start never armed. The job FAILS (which
# emails the repo owner) when something is scheduled and not ready.
#
# Requires the same repo secrets as the reconciliation cron: APP_URL, CRON_SECRET.

on:
  schedule:
    - cron: '0 8 * * 5'    # Fri 08:00 UTC (~10:00–11:00 Israel)
    - cron: '0 12 * * 5'   # Fri 12:00 UTC (~14:00–15:00 Israel) — second chance
  workflow_dispatch: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Fingerbot reachability
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing APP_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi

          # Secret goes in the Authorization header, never the URL, so it isn't
          # logged. 200 = healthy, 503 = coffee scheduled but Fingerbot offline.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/health/coffee") || code=000
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo

          if [ "$code" = "200" ]; then
            echo "Healthy ✅"
            exit 0
          fi

          echo "UNHEALTHY — a coffee is scheduled but the brew path is not ready." >&2
          echo "See the message above (offline gateway, SwitchBot battery, or wrong mode)." >&2
          exit 1

      - name: Check dishwashers are reachable and ready
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          # Everything that silently fails a Shabbat run — appliance off the
          # network, door open, remote start not armed — is fixable now.
          code=$(curl -sS -o /tmp/dw.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/health/dishwashers") || code=000
          echo "HTTP $code"
          cat /tmp/dw.json 2>/dev/null || true
          echo

          if [ "$code" = "200" ]; then
            echo "Dishwashers ready ✅"
            exit 0
          fi

          echo "UNHEALTHY — a dishwasher run is scheduled but the appliance is not ready." >&2
          exit 1

      - name: Send failure alert email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "⚠️ לפני שבת: משהו לא מוכן (קפה/מדיח)"
          to: ilanmichalby@gmail.com
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            בדיקת יום שישי מצאה בעיה שתמנע הפעלה בשבת.

            פירוט מלא (מה בדיוק נכשל):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            מה זה בדרך כלל, ומה לעשות עכשיו:
            - Fingerbot אופליין  -> לאתחל את שער ה-Tuya ולוודא שהוא חוזר ל-WiFi.
            - סוללת SwitchBot נמוכה -> להחליף סוללה.
            - SwitchBot לא ב-pressMode -> לתקן באפליקציית SwitchBot.
            - מדיח מנותק -> לבדוק WiFi ולהפעיל "חיבור רשת קבוע" בתפריט המדיח.
            - דלת פתוחה -> לסגור.
            - הפעלה מרחוק לא מאושרת -> ללחוץ על הכפתור בלוח המדיח.

            יש עדיין זמן לתקן. בשבת כבר לא.
