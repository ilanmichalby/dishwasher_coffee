name: Process Schedule Queue

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Call Process Queue API
        run: |
          curl -X GET "https://dishwasher-coffee.netlify.app/api/process-queue" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
